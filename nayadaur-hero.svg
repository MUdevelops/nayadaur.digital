<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">NayaDaur Digital hero illustration</title>
  <desc id="d">Three local storefronts beneath a rising growth line with glowing connection points, representing local businesses growing online.</desc>
  <rect width="1200" height="460" rx="28" fill="#FAF5E8"/>
  <circle cx="1090" cy="60" r="170" fill="#38BDF8" opacity="0.14"/>
  <circle cx="60" cy="440" r="150" fill="#3B82F6" opacity="0.10"/>
  <rect x="0" y="400" width="1200" height="60" fill="#0B192C" opacity="0.08"/>
  <line x1="480" y1="400" x2="1140" y2="400" stroke="#0B192C" stroke-width="3" stroke-linecap="round"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="170" font-size="46" font-weight="700" fill="#0b192c">Local businesses,</text>
    <text x="64" y="226" font-size="46" font-weight="700" fill="#0B192C">digitally connected.</text>
    <rect x="64" y="248" width="150" height="6" rx="3" fill="#38BDF8"/>
    <text x="64" y="296" font-size="19" fill="#0b192c" opacity="0.8">Visible. Professional. Growing online.</text>
  </g>

  <!-- Storefront A -->
  <g>
    <rect x="560" y="260" width="140" height="140" rx="6" fill="#FFFFFF" stroke="#0B192C" stroke-width="3"/>
    <rect x="560" y="236" width="140" height="28" rx="4" fill="#0B192C"/>
    <rect x="560" y="236" width="35" height="28" fill="#3B82F6"/>
    <rect x="630" y="236" width="35" height="28" fill="#3B82F6"/>
    <rect x="578" y="284" width="64" height="56" rx="4" fill="#38BDF8">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="654" y="300" width="30" height="100" rx="3" fill="#0B192C"/>
  </g>
  <!-- Storefront B -->
  <g>
    <rect x="730" y="210" width="150" height="190" rx="6" fill="#FFFFFF" stroke="#0B192C" stroke-width="3"/>
    <rect x="730" y="184" width="150" height="30" rx="4" fill="#3B82F6"/>
    <rect x="755" y="184" width="37" height="30" fill="#0B192C"/>
    <rect x="830" y="184" width="37" height="30" fill="#0B192C"/>
    <rect x="750" y="240" width="110" height="64" rx="4" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="788" y="322" width="34" height="78" rx="3" fill="#0B192C"/>
  </g>
  <!-- Storefront C -->
  <g>
    <rect x="910" y="240" width="140" height="160" rx="6" fill="#FFFFFF" stroke="#0B192C" stroke-width="3"/>
    <rect x="910" y="214" width="140" height="28" rx="4" fill="#0B192C"/>
    <rect x="945" y="214" width="35" height="28" fill="#3B82F6"/>
    <rect x="1015" y="214" width="35" height="28" fill="#3B82F6"/>
    <rect x="928" y="266" width="64" height="58" rx="4" fill="#38BDF8">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="1004" y="330" width="28" height="70" rx="3" fill="#0B192C"/>
  </g>

  <!-- Growth line -->
  <polyline points="540,150 640,128 760,100 900,112 1040,50" fill="none" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="620" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="620;0" dur="3s" begin="0.3s" fill="freeze"/>
  </polyline>
  <polygon points="1040,36 1062,60 1034,66" fill="#3B82F6">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.85;1" dur="3.4s" fill="freeze"/>
  </polygon>

  <!-- Connection points -->
  <g fill="#0B192C">
    <circle cx="540" cy="150" r="9"/><circle cx="640" cy="128" r="9"/><circle cx="760" cy="100" r="9"/><circle cx="900" cy="112" r="9"/>
  </g>
  <g fill="none" stroke="#38BDF8" stroke-width="3">
    <circle cx="640" cy="128" r="9"><animate attributeName="r" values="9;24" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="100" r="9"><animate attributeName="r" values="9;24" dur="2.6s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="112" r="9"><animate attributeName="r" values="9;24" dur="2.6s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.6s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Floating elements -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="5s" repeatCount="indefinite"/>
    <rect x="1090" y="190" width="70" height="50" rx="8" fill="#FFFFFF" stroke="#0B192C" stroke-width="2.5"/>
    <rect x="1090" y="190" width="70" height="14" rx="6" fill="#0B192C"/>
    <rect x="1100" y="214" width="34" height="5" rx="2.5" fill="#3B82F6"/>
    <rect x="1100" y="224" width="46" height="5" rx="2.5" fill="#38BDF8"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="6s" repeatCount="indefinite"/>
    <path d="M470 330 h60 a10 10 0 0 1 10 10 v28 a10 10 0 0 1 -10 10 h-34 l-14 14 v-14 h-12 a10 10 0 0 1 -10 -10 v-28 a10 10 0 0 1 10 -10z" fill="#3B82F6"/>
    <circle cx="486" cy="354" r="4" fill="#FAF5E8"/><circle cx="500" cy="354" r="4" fill="#FAF5E8"/><circle cx="514" cy="354" r="4" fill="#FAF5E8"/>
  </g>
</svg>
