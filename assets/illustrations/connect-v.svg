<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 400" width="8" height="400" preserveAspectRatio="none" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#38BDF8" stop-opacity="0"/><stop offset="1" stop-color="#38BDF8" stop-opacity=".95"/></linearGradient>
  </defs>
  <line x1="4" y1="0" x2="4" y2="400" stroke="#38BDF8" stroke-opacity=".5" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 9" vector-effect="non-scaling-stroke">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="2.4s" repeatCount="indefinite"/>
  </line>
  <rect x="2.5" y="-120" width="3" height="120" rx="1.5" fill="url(#g)">
    <animate attributeName="y" values="-120;400" dur="5.5s" repeatCount="indefinite"/>
  </rect>
</svg>
